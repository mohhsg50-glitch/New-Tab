<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thil Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video class="bg-video" id="bgVideo" muted loop playsinline></video>
  <div class="bg-overlay" id="bgOverlay"></div>

  <button class="gear-btn" id="settingsBtn" aria-label="الإعدادات">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div class="container">
    <header class="header">
      <div class="search-wrap">
        <div class="search-inner">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" class="search-field" placeholder="ابحث في Google ..." autofocus>
        </div>
      </div>
    </header>

    <div class="grid" id="dashboardGrid">
      <div class="card card-clock" id="cardClock">
        <div class="card-body card-body-center">
          <div class="clock-time" id="timeDisplay">00:00</div>
          <div class="clock-date" id="dateDisplay">---</div>
        </div>
      </div>

      <div class="card card-weather" id="cardWeather">
        <div class="card-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
          </svg>
          <span>الطقس</span>
        </div>
        <div class="card-body card-body-center" id="weatherContent">
          <div class="dim">جاري التحميل ...</div>
        </div>
      </div>

      <div class="card card-links" id="cardLinks">
        <div class="card-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>الروابط</span>
          <button class="card-action" id="addLinkBtn" aria-label="إضافة رابط">+</button>
        </div>
        <div class="card-body" id="linksContainer"></div>
      </div>

      <div class="card card-notes" id="cardNotes">
        <div class="card-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>الملاحظات</span>
          <button class="card-action" id="addNoteBtn" aria-label="إضافة ملاحظة">+</button>
        </div>
        <div class="card-body" id="notesContainer"></div>
      </div>

      <div class="card card-todo" id="cardTodo">
        <div class="card-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>المهام</span>
          <button class="card-action" id="addTodoBtn" aria-label="إضافة مهمة">+</button>
        </div>
        <div class="card-body">
          <div class="todo-row">
            <input type="text" id="todoInput" class="todo-field" placeholder="مهمة جديدة ...">
            <button id="todoSubmit" class="todo-add">إضافة</button>
          </div>
          <div class="todo-list" id="todoContainer"></div>
        </div>
      </div>
    </div>

    <footer class="ftr">
      <span>Thil Dashboard</span>
    </footer>
  </div>

  <div class="modal-wrap" id="settingsModalWrap">
    <div class="modal" id="settingsModal">
      <div class="modal-head">
        <h2>الإعدادات</h2>
        <button class="modal-x" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="sec">
          <h3 class="sec-title">الخلفية</h3>
          <div class="bg-grid">
            <div class="bg-chip" data-bg="default"><div class="bg-swatch sw-def"></div><span>افتراضي</span></div>
            <div class="bg-chip" data-bg="dark"><div class="bg-swatch sw-dark"></div><span>داكن</span></div>
            <div class="bg-chip" data-bg="gradient"><div class="bg-swatch sw-grad"></div><span>تدرج</span></div>
            <div class="bg-chip" data-bg="ocean"><div class="bg-swatch sw-ocean"></div><span>محيط</span></div>
            <div class="bg-chip" data-bg="sunset"><div class="bg-swatch sw-sunset"></div><span>غروب</span></div>
            <div class="bg-chip" data-bg="forest"><div class="bg-swatch sw-forest"></div><span>غابة</span></div>
          </div>
          <div class="bg-actions">
            <label class="btn-upload" for="bgUpload">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <span>صورة</span>
            </label>
            <input type="file" id="bgUpload" accept="image/*" hidden>
            <label class="btn-upload" for="videoUpload">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
              </svg>
              <span>فيديو</span>
            </label>
            <input type="file" id="videoUpload" accept="video/*" hidden>
            <button class="btn-reset" id="bgReset">إزالة</button>
          </div>
        </div>
        <div class="sec">
          <h3 class="sec-title">الموقع</h3>
          <div class="loc-row">
            <input type="text" id="locationInput" class="loc-field" placeholder="اسم المدينة ...">
            <button id="locationSave" class="loc-save">حفظ</button>
          </div>
          <button id="detectLocation" class="loc-detect">تحديد تلقائي</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-wrap" id="linkModalWrap">
    <div class="modal modal-sm" id="linkModal">
      <div class="modal-head">
        <h2 id="linkModalTitle">إضافة رابط</h2>
        <button class="modal-x" id="linkModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="fld">
          <label class="fld-label">الاسم</label>
          <input type="text" id="linkNameInput" class="fld-input" placeholder="Google">
        </div>
        <div class="fld">
          <label class="fld-label">الرابط</label>
          <input type="url" id="linkUrlInput" class="fld-input" placeholder="https://">
        </div>
        <div class="fld">
          <label class="fld-label">الأيقونة</label>
          <div class="ico-picker" id="icoPicker">
            <span class="ico-opt selected" data-ico="globe">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </span>
            <span class="ico-opt" data-ico="mail">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <span class="ico-opt" data-ico="music">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
            <span class="ico-opt" data-ico="video">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </span>
            <span class="ico-opt" data-ico="code">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </span>
            <span class="ico-opt" data-ico="shop">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </span>
            <span class="ico-opt" data-ico="camera">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </span>
            <span class="ico-opt" data-ico="book">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span class="ico-opt" data-ico="game">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></svg>
            </span>
            <span class="ico-opt" data-ico="social">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            </span>
            <span class="ico-opt" data-ico="terminal">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            </span>
          </div>
        </div>
        <div class="fld-actions">
          <button id="linkDeleteBtn" class="btn btn-dgr" style="display:none;">حذف</button>
          <button id="linkSaveBtn" class="btn btn-pri">حفظ</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
