<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thil - ضغط الصور</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>ضاغط الصور</span>
      </div>
    </header>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="upload-content">
        <svg class="upload-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <div class="upload-text">اضغط أو اسحب الصورة هنا</div>
        <div class="upload-hint">JPG, PNG, GIF, WebP</div>
      </div>
    </div>

    <div class="preview-area" id="previewArea" style="display:none;">
      <div class="preview-grid">
        <div class="preview-box">
          <div class="preview-label">الأصلية</div>
          <div class="preview-img-wrap">
            <img id="originalPreview" alt="">
          </div>
          <div class="preview-info" id="originalInfo"></div>
        </div>
        <div class="preview-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>
        <div class="preview-box">
          <div class="preview-label">المضغوطة</div>
          <div class="preview-img-wrap">
            <img id="compressedPreview" alt="">
          </div>
          <div class="preview-info" id="compressedInfo"></div>
        </div>
      </div>

      <div class="controls">
        <div class="control-row">
          <label class="control-label">جودة الضغط</label>
          <div class="control-with-value">
            <input type="range" id="qualitySlider" min="0.1" max="1" step="0.05" value="0.7">
            <span class="quality-value" id="qualityValue">70%</span>
          </div>
        </div>

        <div class="control-row">
          <label class="control-label">الحجم الأقصى (MB)</label>
          <div class="control-with-value">
            <input type="range" id="maxSizeSlider" min="0.1" max="10" step="0.1" value="1">
            <span class="quality-value" id="maxSizeValue">1 MB</span>
          </div>
        </div>

        <div class="control-row">
          <label class="control-label">أقصى عرض/ارتفاع</label>
          <div class="control-with-value">
            <input type="range" id="maxDimensionSlider" min="200" max="4000" step="50" value="1920">
            <span class="quality-value" id="maxDimensionValue">1920</span>
          </div>
        </div>

        <div class="control-row">
          <label class="control-label">نوع المخرج</label>
          <select id="outputFormat" class="format-select">
            <option value="">نفس الأصلي</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
      </div>

      <div class="progress-bar" id="progressBar" style="display:none;">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">جاري الضغط ...</span>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="compressBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
          ضغط الصورة
        </button>
        <button class="btn btn-secondary" id="downloadBtn" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          تحميل
        </button>
        <button class="btn btn-danger" id="resetBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          إزالة
        </button>
      </div>
    </div>
  </div>

  <script src="lib/browser-image-compression.js"></script>
  <script src="popup.js"></script>
</body>
</html>
